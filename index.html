<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Práctica de Formularios y JavaScript</title>
    <style>
        :root {
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-color: #1f2937;
            --error-color: #dc2626;
            --success-color: #16a34a;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 700px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        h1, h2 {
            color: var(--primary-color);
            text-align: center;
        }

        .section-info {
            background-color: #e0e7ff;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.95rem;
        }

        .section-info ul {
            margin: 5px 0 0 20px;
            padding: 0;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        label {
            font-weight: 600;
        }

        input, select {
            padding: 10px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 1rem;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.2);
        }

        .radio-group {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .radio-option {
            display: flex;
            align-items: center;
            gap: 5px;
            font-weight: normal;
        }

        .btn-container {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        button[type="submit"] {
            background-color: var(--primary-color);
            color: white;
        }

        button[type="submit"]:hover {
            background-color: var(--primary-hover);
        }

        button[type="reset"] {
            background-color: #e5e7eb;
            color: #4b5563;
        }

        button[type="reset"]:hover {
            background-color: #d1d5db;
        }

        #error-msg {
            color: var(--error-color);
            font-size: 0.85rem;
            font-weight: bold;
            min-height: 20px;
        }

        .resultado {
            margin-top: 20px;
            padding: 15px;
            border-radius: 6px;
            background-color: #f0fdf4;
            border: 1px solid #bbf7d0;
            display: none;
        }

        .resultado h3 {
            margin-top: 0;
            color: var(--success-color);
        }

        .footer-actitudinal {
            margin-top: 30px;
            border-top: 1px solid #e5e7eb;
            padding-top: 15px;
            font-size: 0.85rem;
            color: #6b7280;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Calculadora de Salud y Bienestar</h1>
        
        <form id="healthForm">
            <div class="form-group">
                <label for="nombre">Nombre Completo:</label>
                <input type="text" id="nombre" name="nombre" placeholder="Ej. Ana Pérez">
            </div>

            <div class="form-group">
                <label for="peso">Peso (kg):</label>
                <input type="number" id="peso" name="peso" step="0.1" placeholder="Ej. 70.5">
            </div>

            <div class="form-group">
                <label for="altura">Altura (metros):</label>
                <input type="number" id="altura" name="altura" step="0.01" placeholder="Ej. 1.75">
            </div>

            <div class="form-group">
                <label>Género:</label>
                <div class="radio-group">
                    <label class="radio-option"><input type="radio" name="genero" value="M" checked> Masculino</label>
                    <label class="radio-option"><input type="radio" name="genero" value="F"> Femenino</label>
                </div>
            </div>

            <div class="form-group">
                <label for="actividad">Nivel de Actividad Física:</label>
                <select id="actividad" name="actividad">
                    <option value="1.2">Sedentario (poco o ningún ejercicio)</option>
                    <option value="1.375">Ligero (ejercicio 1-3 días/sem)</option>
                    <option value="1.55">Moderado (ejercicio 3-5 días/sem)</option>
                    <option value="1.8">Muy activo (ejercicio intenso diario)</option>
                </select>
            </div>

            <div id="error-msg"></div>

            <div class="btn-container">
                <button type="submit">Calcular y Validar</button>
                <button type="reset" id="btnReset">Limpiar</button>
            </div>
        </form>

        <div id="resultadoContainer" class="resultado">
            <h3 id="resTitulo">Resultado</h3>
            <p id="resTexto"></p>
        </div>

        <div class="footer-actitudinal">
            <p><strong>Compromiso Actitudinal:</strong> Desarrollado con responsabilidad, trabajo autónomo y colaboración en equipo para garantizar la correcta validación y accesibilidad del programa.</p>
        </div>
    </div>

    <script>

        const form = document.getElementById('healthForm');
        const errorMsg = document.getElementById('error-msg');
        const resultadoContainer = document.getElementById('resultadoContainer');
        const resTitulo = document.getElementById('resTitulo');
        const resTexto = document.getElementById('resTexto');

        form.addEventListener('submit', function(event) {

            event.preventDefault();


            const nombre = form.elements['nombre'].value.trim();
            const peso = parseFloat(form.elements['peso'].value);
            const altura = parseFloat(form.elements['altura'].value);
            

            let generoSeleccionado = '';
            const generos = form.elements['genero'];
            for (let i = 0; i < generos.length; i++) {
                if (generos[i].checked) {
                    generoSeleccionado = generos[i].value;
                    break;
                }
            }


            const factorActividad = parseFloat(form.elements['actividad'].value);

            if (nombre === "") {
                errorMsg.textContent = "Error: Por favor, introduce tu nombre.";
                form.elements['nombre'].focus();
                return;
            }

            if (isNaN(peso) || peso <= 0) {
                errorMsg.textContent = "Error: Introduce un peso válido mayor a 0.";
                form.elements['peso'].focus();
                return;
            }

            if (isNaN(altura) || altura <= 0) {
                errorMsg.textContent = "Error: Introduce una altura válida mayor a 0.";
                form.elements['altura'].focus();
                return;
            }

            errorMsg.textContent = "";

            const imc = peso / (altura * altura);
            let clasificacion = "";

            if (imc < 18.5) {
                clasificacion = "Bajo peso";
            } else if (imc >= 18.5 && imc < 24.9) {
                clasificacion = "Peso normal (Saludable)";
            } else if (imc >= 25 && imc < 29.9) {
                clasificacion = "Sobrepeso";
            } else {
                clasificacion = "Obesidad";
            }


            resTitulo.textContent = `Hola, ${nombre}`;
            resTexto.innerHTML = `
                Tu Índice de Masa Corporal (IMC) es: <strong>${imc.toFixed(2)}</strong>.<br>
                Clasificación: <strong>${clasificacion}</strong>.<br>
                <em>Nota: Datos procesados exitosamente mediante programación orientada a eventos.</em>
            `;
            resultadoContainer.style.display = "block";
        });

        form.addEventListener('reset', function() {
            errorMsg.textContent = "";
            resultadoContainer.style.display = "none";
        });
    </script>
</body>
</html>
